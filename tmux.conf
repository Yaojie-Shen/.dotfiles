# Getting colors in tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -g mouse on

# Enable more history
set -g history-limit 50000

# Set window and panel index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable activity monitoring to track window output
setw -g monitor-activity on
# Disable visual bell for activity
set -g visual-activity off

# Set pane selection indicator (prefix + q) to display for 5 seconds
set -g display-panes-time 5000

# Move between panes with Ctrl+b + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize using arrow keys with dynamic step
bind Left command-prompt -p "Resize left by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -L \$n'"
bind Right command-prompt -p "Resize right by (default 40):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=40; tmux resize-pane -R \$n'"
bind Up command-prompt -p "Resize up by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -U \$n'"
bind Down command-prompt -p "Resize down by (default 10):" \
    "run 'n=%1; [ -z \"\$n\" ] && n=10; tmux resize-pane -D \$n'"

# Use Ctrl+Shift+Left/Right to move the current window to left/right.
# More info: https://superuser.com/questions/343572/how-do-i-reorder-tmux-windows
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Default is too slow which is annoying during heavy-use of the nvim in tmux.
set-option -s escape-time 0

# TPM plugins. Install/update with prefix + I, after adding new ones here.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Self-bootstrap TPM and plugins on a fresh machine (no manual prefix+I).
# Gated on catppuccin's file, not the tpm dir, since tpm can exist with a
# plugin still missing. Clone+install chained in one `run` (not two, which
# would race - `run` is async). TMUX_PLUGIN_MANAGER_PATH must be set
# manually here: install_plugins needs it, but it's normally only set by
# the final `run tpm/tpm` below (see tmux-plugins/tpm#105).
setenv -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.tmux/plugins/'
if "test ! -f ~/.tmux/plugins/tmux/catppuccin.tmux" \
   "run 'test -d ~/.tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; ~/.tmux/plugins/tpm/bin/install_plugins'"

# Catppuccin theme config (must be set before the plugin loads, below)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# #T can be a long hostname/path; show just the dir for shells, and
# "command · #T" for programs (e.g. "claude · …").
set -g @dotfiles_home "$HOME"
set -g @catppuccin_window_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #T}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{@dotfiles_home}},~,#{b:pane_current_path}},#{pane_current_command} · #T}"
set -g @catppuccin_date_time_text "%m-%d %H:%M"
# Make the date text blend into the status bar rather than a separate pill.
set -g @catppuccin_status_date_time_text_bg "#{E:@thm_bg}"
# Use a real Catppuccin color so rounded window separators render correctly.
set -g @catppuccin_status_background "#{@thm_bg}"

# Load before the custom status format so @thm_* colors are available.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Expand status-left display width to avoid session name truncation
set -g status-left-length 40
set -g status-right-length 100
# Refresh status bar every 2 seconds
set -g status-interval 2

# Two status lines: line 0 is the window list only (full width, so it has
# room to breathe; line 1 holds session, resources, and time.
set -g status 2
set -g status-left ""
set -g status-right ""
set -g status-format[1] '#[align=left]#{E:@catppuccin_status_session} #[align=right]\
#[fg=#{E:@thm_bg},bg=#{E:@thm_blue},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}] 󰻠 #( \
if top -bn1 >/dev/null 2>&1; then \
  top -bn1 | grep "Cpu(s)" | awk "{printf \"%%5.1f%%%%\", \$2 + \$4}"; \
else \
  printf "%%6s" "N/A"; \
fi \
) \
#[fg=#{E:@thm_blue},bg=#{E:@thm_green},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_green}] 󰍛 #( \
if free -m >/dev/null 2>&1; then \
  free -m | awk "/Mem:/ { printf \"%%5.1f%%%%\", \$3/\$2*100 }"; \
else \
  printf "%%6s" "N/A"; \
fi \
) \
#[fg=#{E:@thm_green},bg=#{E:@thm_peach},reverse]#[none]\
#[fg=#{E:@thm_crust},bg=#{E:@thm_peach}] 󰢮 #( \
if command -v nvidia-smi >/dev/null 2>&1; then \
  GPU_MEM=$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | \
    awk "{used+=\$1; total+=\$2} END {if(total>0) print int(used/total*100)}"); \
  GPU_LOAD=$(nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits | \
    awk "{sum+=\$1; count++} END {if(count>0) print int(sum/count)}"); \
  if [ -n "$GPU_MEM" ] && [ -n "$GPU_LOAD" ]; then \
    printf "%%3d%%%% / %%3d%%%%" "$GPU_LOAD" "$GPU_MEM"; \
  else \
    printf "%%4s" "N/A"; \
  fi; \
else \
  printf "%%4s" "N/A"; \
fi \
) \
#[fg=#{E:@thm_peach},bg=#{E:@thm_bg},reverse]#[none]\
#[fg=#{E:@thm_fg},bg=#{E:@thm_bg}]  #{E:@catppuccin_status_date_time}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
